services:
  # 1. The Database
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church_pass
      POSTGRES_DB: church360
    ports:
      - "5455:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: church360-backend
    depends_on:
      - db
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: church
      DATABASE_PASSWORD: church_pass
      DATABASE_NAME: church360
      PORT: 3000
    ports:
      - "5400:3000"  # Backend exposed on localhost:5400
    command: npm run start:prod
    networks:
      - app-network

  welfare-frontend:
    build: ./welfare-frontend
    container_name: welfare-frontend-app
    restart: unless-stopped
    ports:
      - "3001:3000"  # Welfare frontend on localhost:3001
    networks:
      - app-network

  church-frontend:
    build: ./church-frontend
    container_name: church-frontend-app
    restart: unless-stopped
    ports:
      - "3002:3000"  # Church frontend on localhost:3002
    networks:
      - app-network

  proxy:
    build: ./proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80" 
      - "443:443" 
    networks:
      - app-network
    depends_on:
      - backend
      - welfare-frontend
      - church-frontend

volumes:
  db_data: {}

networks:
  app-network:
    driver: bridge

