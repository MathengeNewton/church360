# This file is the "gatekeeper"
events {}

http {
    # Upstream definitions
    upstream backend {
        server backend:3000;
    }

    upstream welfare-frontend {
        server welfare-frontend:3000;
    }

    upstream church-frontend {
        server church-frontend:3000;
    }

    # Welfare Frontend
    server {
        listen 80;
        server_name welfare.church360.local;

        location / {
            proxy_pass http://welfare-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Church Frontend
    server {
        listen 80;
        server_name church.church360.local;

        location / {
            proxy_pass http://church-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API
    server {
        listen 80;
        server_name api.church360.local;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default server (fallback)
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 404;
        }
    }
}
